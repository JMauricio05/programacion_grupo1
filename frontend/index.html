<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
</head>
<body>
    <h1>Lista de contactos</h1>
    <form name="contactoForm">
        <div>
            <input type="text" name="nombre" placeholder="Nombre del contacto">
        </div>
        <div>
            <input type="email" name="email" placeholder="Email del contacto">
        </div>
        <div>
            <input type="text" name="telefono" placeholder="Telefono del contacto">
        </div>
        <button type="submit">Guardar</button>
    </form>
    <br>
    <table id="contactos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Telefono</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>


    <script src="js/contactos.js"></script>
</body>
</html>
